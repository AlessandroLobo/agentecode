  <!-- TYPOGRAPHY -->
  <text class="brand-title" x="215" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Agente<tspan fill="#FF8C38">Code</tspan></text>
