name: Release Linux

# Gera o pacote .deb do AgenteCode para Linux (x64).
# - Push de tag v*: gera o .deb e anexa à Release da tag (junto do instalador do Windows).
# - Push na branch linux-ci: só gera o artefato (execução de teste, nada é publicado).
# - Manual: só gera o artefato, a menos que o campo "tag" aponte para uma tag que já exista.
on:
  push:
    tags:
      - 'v*'
    branches:
      - linux-ci
  workflow_dispatch:
    inputs:
      version:
        description: 'Nome da versão para o arquivo (ex.: v0.0.1-test)'
        required: true
        default: 'v0.0.0-dev'
      tag:
        description: 'Opcional: tag existente cuja Release receberá o .deb. Vazio = só gera o artefato.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # O setup-env.sh do VS Code chama `python` (o Ubuntu 22.04 do GitHub só garante `python3`).
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev libx11-dev libsecret-1-dev libgbm1 fakeroot dpkg-dev

      # As etapas longas gravam o log em logs/*.log; se algo falhar, o final de cada log vira uma anotação
      # pública (a última etapa), porque o texto do log só aparece para quem está logado no GitHub.
      - name: Dependências do projeto (toolchain do VS Code para Linux)
        shell: bash
        run: |
          mkdir -p logs
          {
            set -e
            # Como no pipeline do VS Code: as dependências da pasta build/ vêm antes do setup-env.sh,
            # cujo libcxx-fetcher.ts usa pacotes dela (ex.: debug).
            (
              cd build
              for i in 1 2 3 4 5; do
                npm ci && break
                if [ "$i" -eq 5 ]; then echo "npm ci em build/ falhou 5 vezes" >&2; exit 1; fi
                echo "npm ci em build/ falhou ($i), tentando de novo..."
              done
            )
            source ./build/azure-pipelines/linux/setup-env.sh
            node build/npm/preinstall.ts
            for i in 1 2 3 4 5; do
              npm ci && break
              if [ "$i" -eq 5 ]; then echo "npm ci falhou 5 vezes" >&2; exit 1; fi
              echo "npm ci falhou ($i), tentando de novo..."
            done
          } 2>&1 | tee logs/1-dependencias.log

      - name: Baixar extensões embutidas
        shell: bash
        run: |
          mkdir -p logs
          node build/lib/builtInExtensions.ts 2>&1 | tee logs/2-extensoes.log

      - name: Compilar
        shell: bash
        run: |
          mkdir -p logs
          npm run gulp core-ci 2>&1 | tee logs/3-compilar.log

      - name: Empacotar o cliente
        shell: bash
        run: |
          mkdir -p logs
          npm run gulp vscode-linux-x64-min-ci 2>&1 | tee logs/4-empacotar.log

      - name: Gerar o pacote .deb
        shell: bash
        run: |
          mkdir -p logs
          {
            set -e
            npm run gulp vscode-linux-x64-prepare-deb
            npm run gulp vscode-linux-x64-build-deb
          } 2>&1 | tee logs/5-deb.log

      - name: Nomear o arquivo e calcular o SHA-256
        id: pack
        run: |
          set -e
          mkdir -p dist
          deb=$(ls .build/linux/deb/*/deb/*.deb | head -n1)
          version="${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v0.0.0-dev' }}"
          name="AgenteCode-linux-x64-${version}.deb"
          cp "$deb" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: AgenteCode-linux-x64
          path: dist/*
          if-no-files-found: error

      - name: Anexar à Release (só com tag)
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: dist/*
          prerelease: ${{ contains(github.ref_type == 'tag' && github.ref_name || inputs.tag, '-') }}

      # Falhou: publica o final do log da etapa que caiu (a última com log) como anotação, visível sem login.
      - name: Resumo do erro (anotação)
        if: failure()
        shell: bash
        run: |
          last=$(ls -1 logs/*.log 2>/dev/null | tail -n1)
          [ -n "$last" ] || exit 0
          body=$(tail -n 40 "$last" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Final de $(basename "$last")::${body:0:3800}"
